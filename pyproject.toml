[project]
name = "atlas-vfx"
version = "0.0.1"
description = "VFX nodes for real plates: camera side, layers, Nuke delivery (Atlas estate)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# Lower bounds, not hard pins: this runs inside ComfyUI's own venv, which owns numpy, torch and friends.
# Verified set, V141 venv, 2026-10-26: numpy 2.5.4, scipy 1.18.1, opencv-python 5.0.0, opencolorio 2.6.0,
# jsonschema 4.26.0, pycolmap 4.2.1, OpenImageIO 3.2.1.3 (torch 2.13 and ffmpeg come from ComfyUI and the machine).
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14",
  "opencv-python>=4.10",
  "opencolorio>=2.4",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
solve = ["pycolmap==4.2.1"]
exr = ["OpenImageIO>=3.0"]

[tool.setuptools.packages.find]
include = ["atlas_vfx*"]

[tool.setuptools.package-data]
atlas_vfx = ["contracts/*.json", "layers/data/*"]
